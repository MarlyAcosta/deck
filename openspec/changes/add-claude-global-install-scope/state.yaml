    note: "Real bug found live during Task 4/5 verification: CLAUDE.md's materialization path is root-shaped, not root-agnostic -- Claude Code's convention is <project>/CLAUDE.md for project scope but <root>/.claude/CLAUDE.md for global scope, never <root>/CLAUDE.md. Caught only because a real install was finally run against the real, pre-existing ~/.claude/CLAUDE.md (containing a real @RTK.md inclusion) with explicit user permission -- every prior check used empty temp dirs or --dry-run, neither of which could reveal it. The bad apply created a stray, unread ~/CLAUDE.md and left the real, loaded ~/.claude/CLAUDE.md untouched. Fixed: install-root.ts gained isGlobalInstallRoot (pure comparison); developer-team-install.ts selects .claude/CLAUDE.md vs CLAUDE.md based on it; buildClaudeDeveloperTeamInstallPlan gained one optional test-only knownGlobalRoot parameter so the branch is unit-testable without mocking node:os or writing into the real home directory. Re-verified live after the fix: a real install now previews/applies 'update .claude/CLAUDE.md', correctly merging with the real @RTK.md content. Process near-miss recorded honestly: the second real-install verification was left uncleaned for several turns during Task 4/5 discussion, caught when the full bun test run showed 2 new failures in tests that implicitly depend on the real ~/.claude/agents/ being absent -- cleaned up immediately, environment restored and diff-confirmed identical to its pre-test state. Verified: adapter-claude 130/130 pass (6 new tests); full bun test 5009 pass/1 fail (same pre-existing failure) across 323 files; tsc 0 errors; deck openspec validate 0 errors for this change."
