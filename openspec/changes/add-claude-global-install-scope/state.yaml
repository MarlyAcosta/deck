    registryWrite: non-deferred
    note: "Task 6 (final regression gate) complete. bun test: 5009 pass/2 skip/1 fail across 323 files, the 1 failure the same pre-existing environment-dependent case confirmed throughout this change and add-claude-code-runner-support to also fail on bare upstream/main. bunx tsc --noEmit: 0 errors monorepo-wide. deck openspec validate: 0 errors/warnings attributable to this change (879 errors/737 warnings total is the same pre-existing repo-wide baseline magnitude). Real environment reconfirmed clean: no leftover ~/.claude/agents, ~/.claude/skills, or ~/CLAUDE.md; ~/.claude/CLAUDE.md diff-confirmed byte-identical to its pre-work state. Change is functionally complete: Tasks 1-6 done and verified, including a real CLAUDE.md-path bug found live and fixed along the way. Also: investigated (at user request, no code changed) whether Claude's forced --permission-mode bypassPermissions could be relaxed toward OpenCode's safer always-interactive default for the 3 stdio-inherited launch modes (interactive/resume-by-id/resume-latest), keeping it only for headless exec. Found live that Codex gets the identical forced-bypass treatment (not Claude-specific), that Pi/OpenCode never force any bypass, and that no --permission-mode value in headless mode actually gates destructively (manual mode let a bash command through same as bypassPermissions; only plan mode differs, by blocking all writes outright rather than prompting). Could not verify live whether Claude Code's native interactive prompt UI renders correctly when Deck spawns it with inherited stdio -- pty-simulated keystroke tests were inconclusive (an Ink-style raw-mode TUI, same class of limitation add-claude-code-runner-support's own Phase 6 recorded for driving Deck's own TUI). User decided to defer implementing this change for now; findings are recorded here as project memory-worthy context for a future revisit, not enacted."
