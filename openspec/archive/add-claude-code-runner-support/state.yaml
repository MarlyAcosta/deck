next_action: "All 7 phases complete and verified, including a rebase onto the latest upstream/main (v0.4.0) with zero content drift in the Claude phases. Remaining known-deferred work, unchanged from Phase 6 and explicitly tracked (not silently dropped): Task 3.6 (standalone/bootstrap skills), the trusted-execution-boundary gap, dynamic model discovery (a 3-entry static mapping stands in for Codex-style live query), MCP capability-driven selection (only the generic single-server writer exists), buildReviewPlan's simplicity needing revisit once capability-driven MCP selection exists, and shared capability-registry participation (Context7/Serena/RTK/Context Mode/Codebase Memory/Web Search/Supermemory all report as gaps in packages/adapter-claude/src/capability-catalog.ts). The adapter is real and documented at its earned status end-to-end: it detects, plans, previews with accurate mutation metadata, applies, launches, verifies, backs up, rolls back, and self-diagnoses a real Claude Code runner; every RunnerAdapter interface method is implemented for real; and every maintained doc surface reflects this status honestly rather than the stale 'detection only' claim. This change is ready to archive."
